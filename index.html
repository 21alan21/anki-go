}

/* ----------------------- Mis tarjetas ----------------------- */
function isDraftCard(card){
  return !treeHasVerdict(card.tree, 'correct');
}
const NAT_COLLATOR = new Intl.Collator('es', {numeric:true, sensitivity:'base'});   // reutilizado: mucho más rápido que localeCompare con opciones
function naturalCompare(a, b){
  return NAT_COLLATOR.compare(a, b);
}
/** Minúsculas y sin acentos, para buscar. */
function foldText(t){ return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
/** «12/340»: al tocarlo se convierte en un campo numérico para saltar directo a esa posición (1…total). */
function positionJumper(index, total, onJump){
  const b = document.createElement('button'); b.className='btn ghost small';
  b.style.cssText = 'min-width:74px; font-variant-numeric:tabular-nums;';
  b.textContent = `${index+1}/${total}`; b.title = 'Toca para escribir el número al que quieres ir';
  b.addEventListener('click', ()=>{
    const inp = document.createElement('input'); inp.type='number'; inp.min=1; inp.max=total; inp.value=index+1;
    inp.inputMode='numeric'; inp.style.cssText='width:74px; padding:7px 6px; text-align:center; align-self:center;';
    let done = false;
    const finish = (commit)=>{
      if(done) return; done = true;
      const n = parseInt(inp.value,10);
      if(commit && n>=1 && n<=total && n-1!==index) onJump(n-1);
      else if(inp.parentNode) inp.replaceWith(b);
    };
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); finish(true); } else if(e.key==='Escape') finish(false); });
    inp.addEventListener('blur', ()=>finish(true));
    b.replaceWith(inp); inp.focus(); inp.select();
  });
  return b;
}
/** Buscador con resultados en orden alfabético (no en el orden de la secuencia). items: [{label, sub, onPick}] */
function searchPicker(labelText, items){
  const f = document.createElement('div'); f.className='field';
  f.innerHTML = `<label>${labelText}</label>`;
  const inp = document.createElement('input'); inp.type='search'; inp.placeholder='Escribe para buscar…';
  inp.autocomplete='off'; f.appendChild(inp);
  const box = document.createElement('div'); box.className='lines-box'; box.style.cssText='display:none; max-height:240px; overflow-y:auto; margin-top:6px;';
  f.appendChild(box);
  let sorted = null;   // se ordena la primera vez que se busca (con miles de tarjetas, no al abrir la pantalla)
  const refresh = ()=>{
    const q = foldText(inp.value).trim();
    if(q && !sorted) sorted = items.slice().sort((a,b)=>naturalCompare(a.label, b.label));
    box.innerHTML = '';
    if(!q){ box.style.display='none'; return; }
    const hits = sorted.filter(it=>foldText(it.label+' '+(it.sub||'')).includes(q));
    box.style.display = 'block';
    if(!hits.length){ box.innerHTML = '<div class="hint" style="margin:6px 0;">Sin resultados.</div>'; return; }
    hits.slice(0,40).forEach(it=>{
      const row = document.createElement('div'); row.className='line-item'; row.style.cssText='cursor:pointer; display:block;';
      const a = document.createElement('div'); a.textContent = it.label;
      const b = document.createElement('div'); b.className='hint'; b.style.cssText='margin:2px 0 0; font-size:12px;'; b.textContent = it.sub||'';
      row.appendChild(a); row.appendChild(b);
      row.addEventListener('click', it.onPick);
      box.appendChild(row);
    });
    if(hits.length>40){ const m = document.createElement('div'); m.className='hint'; m.style.margin='6px 0'; m.textContent = `Mostrando 40 de ${hits.length}. Escribe más para acotar.`; box.appendChild(m); }
  };
  inp.addEventListener('input', refresh);
  return f;
}
function cardSortLabel(card){
  return (card.title && card.title.trim()) || (card.note && card.note.trim()) || 'Sin título';
}
function compareCards(a, b, sortKey){
  switch(sortKey){
    case 'alpha':
      return naturalCompare(cardSortLabel(a), cardSortLabel(b));
    case 'alpha-desc':
      return naturalCompare(cardSortLabel(b), cardSortLabel(a));
    case 'newest':
      return (b.createdAt||0) - (a.createdAt||0);
    case 'oldest':
      return (a.createdAt||0) - (b.createdAt||0);
    case 'size':
      return a.boardSize - b.boardSize || naturalCompare(cardSortLabel(a), cardSortLabel(b));
    case 'due':
    default:
      return a.srs.due.localeCompare(b.srs.due);
  }
}

  const groups = new Map();
  filtered.forEach(c=>{

      if(budget<=0) break;
      renderCardItem(root, card); budget--;

  const shown = (State.listLimit||60) - Math.max(0, budget);
  if(shown<total){
    const more = document.createElement('div'); more.className='btnrow';
    const mb = document.createElement('button'); mb.className='btn ghost';
    mb.textContent = `Mostrar más (${total-shown} restantes)`;
    mb.addEventListener('click', ()=>{ State.listLimit = (State.listLimit||60) + 60; render(); });
    more.appendChild(mb); root.appendChild(more);
  }
}

// El tenuki es un nodo «pasar» ({pass:true}, SGF ;B[] / ;W[]) con su propia continuación. En SGF: C[], LOSS[].
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

function mergeTreeInto(t, src, title, depth){
  depth = depth||0;
  let added = 0;
  src.children.forEach(sc=>{
    let tc = t.children.find(c=>c.x===sc.x && c.y===sc.y && c.color===sc.color);
    if(!tc){
      tc = newTreeNode(sc.x, sc.y, sc.color); if(sc.pass) tc.pass = true; addChildSorted(t, tc); added++;
      if(depth===0 && title && !tc.comment) tc.comment = title;
    }
    if(sc.comment && !tc.comment) tc.comment = sc.comment;
    if(sc.loss!=null && tc.loss==null) tc.loss = sc.loss;
    if(sc.tenuki && !tc.tenuki) tc.tenuki = JSON.parse(JSON.stringify(sc.tenuki));
    if(sc.flag) tc.flag = true;
    if(sc.marks){ tc.marks = tc.marks||[]; sc.marks.forEach(m=>{ if(!tc.marks.some(q=>q.x===m.x&&q.y===m.y)) tc.marks.push(m); }); }
    added += mergeTreeInto(tc, sc, title, depth+1);
  });
  return added;
}
/** Convierte el tenuki antiguo ({loss,comment,move}) en un nodo «pasar» con su continuación. */
function migrateTenuki(book){
  let changed = false;
  const first = bookFirstColor(book);
  const walk = (node)=>{
    if(node.tenuki){
      const t = node.tenuki; delete node.tenuki; changed = true;
      const opp = c=>c==='B'?'W':'B';
      const prev = node.color || opp(first);
      if(!passChild(node)){
        const p = newPassNode(opp(prev));
        if(t.loss!=null && t.loss!=='') p.loss = t.loss;
        if(t.comment) p.comment = t.comment;
        if(t.move){ const st = newTreeNode(t.move.x, t.move.y, prev); p.children.push(st); }
        node.children.push(p);
      }
    }
    node.children.forEach(walk);
  };
  walk(book.tree);
  if(changed) sortPassLast(book.tree);
  return changed;
}

// --- SGF ---
function sgfText(t){ return String(t).replace(/([\]\\])/g,'\\$1'); }
function bookNodeProps(n){
  let o = '';
  if(n.comment) o += `C[${sgfText(n.comment)}]`;
  if(n.loss!=null && n.loss!=='') o += `LOSS[${n.loss}]`;
  if(n.flag) o += 'FLAG[1]';
  o += marksToSGF(n.marks);
  return o;
}
function bookBody(node){
  let o = '';
  if(node.x!==null) o += `;${node.color}[${node.pass ? '' : coordChar(node.x)+coordChar(node.y)}]` + bookNodeProps(node);
  if(node.children.length===1) o += bookBody(node.children[0]);
  else node.children.forEach(c=>{ o += '(' + bookBody(c) + ')'; });
  return o;
}
function bookToSGF(book){
  return `(;GM[1]FF[4]CA[UTF-8]SZ[${book.boardSize}]` + (book.title ? `GN[${sgfText(book.title)}]` : '') + bookNodeProps(book.tree) + bookBody(book.tree) + ')';
}
/** Fusiona un SGF (con sus variantes, comentarios y pérdidas) en el árbol. Devuelve jugadas nuevas, o null si no es compatible. */
function mergeSGFIntoBook(text, book){
  const gt = parseSGF(text);
  if(!gt) throw new Error('SGF no válido');
  const head = gt.sequence[0] || {};
  const size = head.SZ ? parseInt(head.SZ[0],10) : 19;
  if(size!==book.boardSize) return null;
  if((head.AB && head.AB.length) || (head.AW && head.AW.length)) return null;
  const applyProps = (node, props)=>{
    if(props.C && props.C[0] && !node.comment) node.comment = props.C[0];
    if(props.TENUKIM){ const q = sgfXY(props.TENUKIM[0]); if(q && q.x<book.boardSize && q.y<book.boardSize){ node.tenuki = node.tenuki||{}; if(!node.tenuki.move) node.tenuki.move = {x:q.x,y:q.y}; } }
    if(props.FLAG) node.flag = true;
    mergeMarks(node, marksFromProps(props, book.boardSize));
    if(props.LOSS){ const v = parseFloat(props.LOSS[0]); if(!isNaN(v) && node.loss==null) node.loss = v; }
    if(props.TENUKI){ const v = parseFloat(props.TENUKI[0]); if(!isNaN(v)){ node.tenuki = node.tenuki||{}; if(node.tenuki.loss==null) node.tenuki.loss = v; } }
    if(props.TENUKIC){ node.tenuki = node.tenuki||{}; if(!node.tenuki.comment) node.tenuki.comment = props.TENUKIC[0]; }
  };
  let added = 0;
  const walk = (g, parent, first)=>{
    let cur = parent;
    g.sequence.forEach((props, i)=>{
      const mv = props.B ? {c:'B', v:props.B[0]} : (props.W ? {c:'W', v:props.W[0]} : null);
      if(mv){
        const isPass = mv.v==='' || (mv.v==='tt' && book.boardSize<=19);
        const pt = isPass ? null : sgfXY(mv.v);
        if(!isPass && (!pt || pt.x>=book.boardSize || pt.y>=book.boardSize)) return;
        let child = isPass ? cur.children.find(c=>c.pass && c.color===mv.c) : cur.children.find(c=>c.x===pt.x && c.y===pt.y && c.color===mv.c);
        if(!child){ child = isPass ? newPassNode(mv.c) : newTreeNode(pt.x, pt.y, mv.c); addChildSorted(cur, child); added++; }
        cur = child; applyProps(cur, props);
      } else if(!(first && i===0)) applyProps(cur, props);   // comentarios sueltos; la cabecera se ignora
    });
    g.children.forEach(ch=>walk(ch, cur, false));
  };
  walk(gt, book.tree, true);
  migrateTenuki(book);
  return added;
}

  const book = State.book;

/** entries: [{name, text, folder}] — cada SGF pasa a ser un joseki con su carpeta. */
async function importJosekiEntries(entries){
  let ok = 0, skipped = 0, bad = 0;
  for(const e of entries){
    try{
      const rec = newJosekiRecord('', e.folder||'');
      const n = mergeSGFIntoBook(e.text, rec);
      if(n===null){ skipped++; continue; }
      const head = (parseSGF(e.text).sequence[0]) || {};
      rec.title = e.name.replace(/^.*\//,'').replace(/\.sgf$/i,'').trim() || (head.GN && head.GN[0]) || 'Joseki';
      await storeSet('joseki:'+rec.id, rec); ok++;
    }catch(err){ bad++; }
  }
  await loadJosekiList();
  if(skipped||bad) showToast(`Importados ${ok}. Omitidos: ${skipped} (tamaño o piedras iniciales), ilegibles: ${bad}.`, 'warn');
  render();
}

/** Mueve la jugada actual y todo lo que sigue a un archivo nuevo (con la línea que lleva hasta ella, para poder practicarlo solo). */
async function splitBookHere(){
  const book = State.book, bk = State.bk;
  if(!book || !bk || bk.path.length<2) return;
  const path = bk.path, node = path[path.length-1], parent = path[path.length-2];
  const where = node.pass ? 'tenuki' : coordLabel(node.x, node.y, book.boardSize);
  const name = prompt('Nombre del archivo nuevo (se mueve esta jugada y todo lo que sigue):', ((book.title||'Joseki')+' – '+where));
  if(name===null) return;
  const rec = newJosekiRecord(name.trim() || ((book.title||'Joseki')+' – '+where), book.folder||'');
  if(book.tree.comment) rec.tree.comment = book.tree.comment;
  let cur = rec.tree;
  path.slice(1).forEach(n=>{
    const c = (n===node) ? n : JSON.parse(JSON.stringify(Object.assign({}, n, {children:[]})));
    cur.children.push(c); cur = c;
  });
  parent.children = parent.children.filter(c=>c!==node);
  bk.path = path.slice(0,-1);
  clearTimeout(bookTimer);
  await saveBook();
  await storeSet('joseki:'+rec.id, rec);
  (State.lists.joseki = State.lists.joseki||[]).push(rec);
  openJosekiFile(rec);
}

// --- utilidades de árbol ---
function bookFirstColor(book){ const c = book.tree.children.find(c=>!c.pass) || book.tree.children[0]; return (c && c.color) || 'B'; }
function bookTurn(book, path){
  const last = path[path.length-1];
  if(last && last.color) return last.color==='B' ? 'W' : 'B';
  return bookFirstColor(book);
}
function bookStones(book, path){ return buildLineDisplay(book.boardSize, [], pathToMoves(path)).stones; }
function fmtLoss(v){ return v==null || v==='' ? '—' : (Number(v)===0 ? '0 pts' : Number(v)+' pts'); }
function bookStep(d){
  const bk = State.bk; if(!bk) return;
  if(d<0){ if(bk.path.length>1) bk.path = bk.path.slice(0,-1); }
  else { const c = bk.path[bk.path.length-1]; if(c.children.length) bk.path = bk.path.concat([c.children[0]]); }
  render();
}
/** Jugar o navegar en un árbol de jugadas (biblioteca y partidas): comparten reglas, marcas y legalidad. */
function treeClick(h, x, y, o){
  const cursor = h.path[h.path.length-1];
  if(h.mode==='marks'){ toggleNodeMark(cursor, x, y, h.markShape||'triangle'); o.onChange(); render(); return; }
  const existing = cursor.children.find(c=>c.x===x && c.y===y);
  if(existing){ h.path = h.path.concat([existing]); render(); return; }
  const moves = pathToMoves(h.path);
  const stones = buildLineDisplay(o.size, o.setup, moves).stones;
  const color = o.color();
  const koKey = moves.length>=1 ? boardKey(buildLineDisplay(o.size, o.setup, moves.slice(0,-1)).stones) : null;
  const check = checkMoveLegality(stones, o.size, x, y, color, koKey);
  if(!check.legal){
    if(check.reason==='occupied') return;
    showToast(check.reason==='ko' ? 'Jugada ilegal (ko).' : 'Jugada ilegal (suicidio).', 'warn');
    render(); return;
  }
  const node = newTreeNode(x,y,color);
  addChildSorted(cursor, node);
  h.path = h.path.concat([node]);
  o.onChange();
  render();
}
/** Barra « ‹ › » y botón de eliminar jugada/rama, iguales en biblioteca y partidas. */
function treeNavRow(h, rootNode){
  const cur = h.path[h.path.length-1], total = h.path.length-1;
  const nav = document.createElement('div'); nav.className='btnrow';
  [['«','Inicio',()=>{ h.path=[rootNode]; render(); }, total===0],
   ['‹','Anterior',()=>{ if(h.path.length>1) h.path = h.path.slice(0,-1); render(); }, total===0],
   ['›','Siguiente',()=>{ if(cur.children.length) h.path = h.path.concat([cur.children[0]]); render(); }, !cur.children.length],
   ['»','Final',()=>{ let p=h.path.slice(); let c=p[p.length-1]; while(c.children.length){ c=c.children[0]; p.push(c); } h.path=p; render(); }, !cur.children.length]
  ].forEach(([label,title,fn,dis])=>{
    const b = document.createElement('button'); b.className='btn ghost'; b.style.flex='1'; b.textContent=label; b.title=title; b.disabled=dis;
    b.addEventListener('click', fn); nav.appendChild(b);
  });
  return nav;
}
function deleteMoveButton(h, onChange){
  const cur = h.path[h.path.length-1];
  const b = document.createElement('button'); b.className='btn ghost small';
  b.textContent = cur.children.length ? 'Eliminar rama' : 'Eliminar jugada'; b.disabled = h.path.length<2;
  b.addEventListener('click', ()=>{
    if(cur.children.length && !confirm('Esta rama tiene jugadas después. ¿Eliminar todo?')) return;
    const parent = h.path[h.path.length-2];
    parent.children = parent.children.filter(c=>c!==cur);
    h.path = h.path.slice(0,-1); onChange(); render();
  });
  return b;
}
function bookOpts(){
  const book = State.book, bk = State.bk;
  return {size:book.boardSize, setup:[], color:()=>bookTurn(book,bk.path), onChange:saveBook};
}
function bookConfirm(){
  const bk = State.bk; if(!bk || !bk.pending) return;
  const {x,y} = bk.pending; pendingClear(bk);
  treeClick(bk, x, y, bookOpts());
}
function bookClick(x,y){
  const book = State.book, bk = State.bk;
  const cur = bk.path[bk.path.length-1];
  if(bk.mode==='marks' || cur.children.some(c=>c.x===x && c.y===y)){ pendingClear(bk); treeClick(bk, x, y, bookOpts()); return; }
  bk.boardSize = book.boardSize;
  pendingTap(bk, cur, x, y, bookStones(book, bk.path).has(x+','+y), bookConfirm);
}
document.addEventListener('keydown', e=>{
  if(State.view!=='joseki-lib' || !State.bk) return;
  const tag = (e.target && e.target.tagName) || '';
  if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT') return;
  if(e.key==='ArrowLeft'){ bookStep(-1); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ bookStep(1); e.preventDefault(); }
});
function numField(label, getVal, setVal, onDone){
  const f = document.createElement('div'); f.className='field'; f.style.flex='1';
  f.innerHTML = `<label>${label}</label>`;
  const i = document.createElement('input'); i.type='text'; i.inputMode='decimal';
  const v = getVal(); i.value = v==null ? '' : v;
  i.placeholder = 'pts';
  i.addEventListener('input', ()=>{
    const t = i.value.trim().replace(',','.');
    if(t===''){ setVal(null); }
    else { const n = parseFloat(t); if(!isNaN(n)) setVal(n); }
    bookChanged();
  });
  i.addEventListener('change', ()=>{ if(onDone) onDone(); });
  f.appendChild(i);
  return f;
}
/** Pérdida de puntos (campo mínimo) + comentario que ocupa el resto. */
function lossComment(getLoss, setLoss, getC, setC, ph){
  const r = document.createElement('div'); r.className='lossrow';
  const nf = numField('Pts', getLoss, setLoss, null); nf.className='field loss'; nf.style.flex='none'; nf.querySelector('input').placeholder='';
  nf.querySelector('input').maxLength = 4;
  const tf = textField('Comentario', getC, setC, ph); tf.classList.add('cmt');
  r.appendChild(nf); r.appendChild(tf);
  return r;
}
function textField(label, getVal, setVal, ph){
  const f = document.createElement('div'); f.className='field';
  f.innerHTML = `<label>${label}</label>`;
  const t = document.createElement('textarea'); t.style.minHeight='54px'; t.style.height='54px';
  t.value = getVal() || ''; t.placeholder = ph||'';
  t.addEventListener('input', ()=>{ setVal(t.value); bookChanged(); });
  f.appendChild(t);
  return f;
}

// --- práctica: como el repaso de tsumegos (doble toque o botón para confirmar; la máquina responde) ---
function jpMakeView(b){
  const p = State.prefs || {};
  const t = randomTransform(!!p.jsSym, !!p.jsInv);
  if(tfIsIdentity(t)) return b;
  return {boardSize:b.boardSize, tree:tfTree(b.tree, t, b.boardSize)};
}
function mergeForPractice(t, src, rec){
  src.children.forEach(sc=>{
    let tc = t.children.find(c=>c.x===sc.x && c.y===sc.y && c.color===sc.color);
    if(!tc){ tc = newTreeNode(sc.x, sc.y, sc.color); if(sc.pass) tc.pass = true; addChildSorted(t, tc); tc._src = sc; tc._rec = rec; tc._srcs = []; }
    tc._srcs.push({node:sc, rec});
    if(sc.comment && !tc.comment) tc.comment = sc.comment;
    if(sc.loss!=null && tc.loss==null) tc.loss = sc.loss;
    if(sc.flag) tc.flag = true;
    if(sc.marks){ tc.marks = tc.marks||[]; sc.marks.forEach(m=>{ if(!tc.marks.some(q=>q.x===m.x&&q.y===m.y)) tc.marks.push(m); }); }
    mergeForPractice(tc, sc, rec);
  });
}
/** Árbol de práctica según la selección: todo, una carpeta o un archivo. Con varios archivos se combinan en un solo árbol. */
/** Un joseki cuenta para practicar si tiene jugadas y no está desactivado. */
function josekiFolderOn(r){ const f = State.prefs && State.prefs.josekiFolders; return !f || f.includes(r.folder||''); }
function gameFolderOn(g){ const f = State.prefs && State.prefs.gameFolders; return !f || f.includes(g.folder||''); }
function josekiActive(r){ return r.tree.children.length>0 && josekiFolderOn(r); }
function jpBuildSource(){
  const recs = (State.lists.joseki||[]).filter(josekiActive);
  const sel = State.jpSel || 'all';
  let chosen = recs;
  if(sel.startsWith('folder:')) chosen = recs.filter(r=>(r.folder||'')===sel.slice(7));
  else if(sel.startsWith('file:')) chosen = recs.filter(r=>r.id===sel.slice(5));
  if(chosen.length===1) return {boardSize:19, tree:chosen[0].tree, rec:chosen[0]};
  const tree = newTreeRoot();
  chosen.forEach(r=>mergeForPractice(tree, r.tree, r));
  return {boardSize:19, tree};
}
function jpState(){
  const b = State.jpSrc;
  if(!State.jp || State.jp.tree!==b.tree){
    State.jp = {tree:b.tree, view:jpMakeView(b), path:[], side:null, pending:null, lastTap:0, panel:null, msg:'', notes:[], showOptions:false, busy:false, mistakes:0};
    State.jp.path = [State.jp.view.tree];
    State.jp.side = bookFirstColor(State.jp.view);
  }
  return State.jp;
}
function jpUserTurn(js){
  const cur = js.path[js.path.length-1];
  return cur.children.length>0 && (js.side==='both' || cur.children[0].color===js.side);
}
function jpMachineTurn(js){
  const cur = js.path[js.path.length-1];
  return cur.children.length>0 && js.side!=='both' && cur.children[0].color!==js.side;
}
function jpNote(label, node){
  const hasLoss = node.loss!=null && node.loss!=='';
  return {loss: hasLoss ? fmtLoss(node.loss) : '', text: node.comment||''};
}
/** La máquina responde sola (al azar entre las ramas de su color), igual que en el repaso de tsumegos. */
async function jpMachine(){
  const js = State.jp; if(!js || js.busy) return;
  js.busy = true;
  while(State.jp===js && jpMachineTurn(js)){
    await wait(380);
    if(State.jp!==js) return;
    const kids = js.path[js.path.length-1].children;
    const ch = kids[Math.floor(Math.random()*kids.length)];
    js.path = js.path.concat([ch]);
    js.notes.push(jpNote('Respuesta', ch));
    render();
  }
  js.busy = false;
  render();
}
function jpTap(x,y){
  const js = State.jp;
  if(js.busy || !jpUserTurn(js)) return;
  const stones = bookStones(js.view, js.path);
  if(stones.has(x+','+y)) return;
  const now = Date.now();
  const dbl = js.pending && js.pending.x===x && js.pending.y===y && (now-(js.lastTap||0))<400;
  js.pending = {x,y}; js.lastTap = now; js.panel = null; js.msg = '';
  if(dbl){ jpConfirm(); return; }
  render();
}
/** Si la posición actual es simétrica (espejo/giro), una jugada equivalente por simetría también vale:
 *  se reorienta la biblioteca para que esa jugada coincida con la rama correspondiente. */
function jpSymmetricMatch(js, x, y){
  const view = js.view, n = view.boardSize;
  const stones = bookStones(view, js.path);
  const cur = js.path[js.path.length-1];
  for(let m=0;m<2;m++) for(let r=0;r<4;r++){
    if(!m && !r) continue;
    const g = {r, m:!!m, swap:false};
    let inv = true;
    for(const [k,col] of stones){
      const [sx,sy] = k.split(',').map(Number);
      const [gx,gy] = tfPoint(g,n,sx,sy);
      if(stones.get(gx+','+gy)!==col){ inv=false; break; }
    }
    if(!inv) continue;
    if(!cur.children.some(c=>{ const [gx,gy]=tfPoint(g,n,c.x,c.y); return gx===x && gy===y; })) continue;
    const tree = tfTree(view.tree, g, n);
    const path = [tree]; let node = tree;
    for(let i=1;i<js.path.length;i++){
      const mv = js.path[i]; const [gx,gy] = tfPoint(g,n,mv.x,mv.y);
      node = node.children.find(c=>c.x===gx && c.y===gy);
      if(!node) { path.length=0; break; }
      path.push(node);
    }
    if(!path.length) continue;
    const hit = node.children.find(c=>c.x===x && c.y===y);
    if(!hit) continue;
    js.view = {boardSize:n, tree}; js.path = path;
    return hit;
  }
  return null;
}
/** Pasar: si la biblioteca tiene el tenuki aquí, sigue la secuencia local; si no, cuenta como fallo. */
function jpTenuki(){
  const js = State.jp;
  if(js.busy || !jpUserTurn(js)) return;
  const cur = js.path[js.path.length-1];
  const p = passChild(cur);
  js.pending = null;
  if(!p){ js.mistakes++; js.panel = 'miss'; js.msg = 'Incorrecto'; render(); return; }
  js.path = js.path.concat([p]); js.panel = null; js.msg = ''; js.notes = [jpNote('Tenuki', p)];
  render(); jpMachine();
}
function jpConfirm(){
  const js = State.jp;
  if(!js.pending || js.busy || !jpUserTurn(js)) return;
  const {x,y} = js.pending; js.pending = null;
  const cur = js.path[js.path.length-1];
  let match = cur.children.find(c=>c.x===x && c.y===y);
  if(!match){ match = jpSymmetricMatch(js, x, y); }
  if(!match){
    js.mistakes++; js.panel = 'miss'; js.msg = 'Incorrecto';
    render(); return;
  }
  js.path = js.path.concat([match]);
  js.panel = null; js.msg = ''; js.notes = [jpNote('Tu jugada', match)];
  render();
  jpMachine();
}

/* ----------------------- Colecciones: partidas y josekis (fuera del repaso) ----------------------- */
const COLL = {
  game:   {prefix:'game:',   title:'Partidas',  one:'partida', idp:'g'},
  joseki: {prefix:'joseki:', title:'Biblioteca de josekis', one:'joseki', idp:'j'},
};
async function storeListColl(kind){
  const prefix = COLL[kind].prefix;
  const out = [];
  const add = v=>{ try{ const g = JSON.parse(v); if(g && g.tree) out.push(g); }catch(e){} };
  if(storageMode!=='local'){ memoryStore.forEach((v,k)=>{ if(k.startsWith(prefix)) add(v); }); return out; }
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(LS_PREFIX+prefix)){ const v = localStorage.getItem(k); if(v) add(v); }
    }
  }catch(e){ memoryStore.forEach((v,k)=>{ if(k.startsWith(prefix)) add(v); }); }
  return out;
}
function gameMainLength(tree){
  let n = 0, cur = tree;
  while(cur.children.length){ cur = cur.children[0]; n++; }
  return n;
}
function gameMetaLine(g){
  const i = g.info || {};
  const pl = (i.pb||i.pw) ? `${esc(i.pb||'?')}${i.br?' ('+esc(i.br)+')':''} vs ${esc(i.pw||'?')}${i.wr?' ('+esc(i.wr)+')':''} · ` : '';
  const dt = i.date ? esc(i.date)+' · ' : '';
  if(!g.info) return `${g.boardSize}×${g.boardSize} · ${countNodes(g.tree)} jugadas`;
  return `${pl}${dt}${g.boardSize}×${g.boardSize} · ${gameMainLength(g.tree)} jugadas`;
}

/** Piedras de handicap estándar (puntos estrella). */
function handicapStones(size, h){
  if(!(h>=2) || ![9,13,19].includes(size)) return [];
  const lo = size===9 ? 2 : 3, hi = size-1-lo, mid = (size-1)/2;
  const P = {tr:[hi,lo], bl:[lo,hi], br:[hi,hi], tl:[lo,lo], l:[lo,mid], r:[hi,mid], t:[mid,lo], b:[mid,hi], c:[mid,mid]};
  const order = {2:['tr','bl'],3:['tr','bl','br'],4:['tr','bl','br','tl'],5:['tr','bl','br','tl','c'],6:['tr','bl','br','tl','l','r'],
    7:['tr','bl','br','tl','l','r','c'],8:['tr','bl','br','tl','l','r','t','b'],9:['tr','bl','br','tl','l','r','t','b','c']};
  return (order[Math.min(h,9)]||[]).map(k=>({x:P[k][0], y:P[k][1], color:'B'}));
}

function pendingTap(h, cursor, x, y, occupied, confirmFn){

/** Ventana de tablero (9×9 en 19×19) centrada en el punto tocado, ajustada a los bordes. */
function zoomBoxAround(size, x, y){

function gameBody(node){
  let o = '';
  if(node.x!==null) o += `;${node.color}[${node.pass ? '' : coordChar(node.x)+coordChar(node.y)}]`;
  if(node.comment) o += `C[${sgfText(node.comment)}]`;

  else node.children.forEach(c=>{ o += '(' + gameBody(c) + ')'; });
  return o;

function gameToSGF(g){
  const i = g.info || {};
  let h = `(;GM[1]FF[4]CA[UTF-8]SZ[${g.boardSize}]`;
  if(g.title) h += `GN[${sgfText(g.title)}]`;
  if(i.pb) h += `PB[${sgfText(i.pb)}]`;
  if(i.pw) h += `PW[${sgfText(i.pw)}]`;
  if(i.br) h += `BR[${sgfText(i.br)}]`;
  if(i.wr) h += `WR[${sgfText(i.wr)}]`;
  if(i.komi!=='' && i.komi!=null) h += `KM[${sgfText(i.komi)}]`;
  if(i.handicap>=2) h += `HA[${i.handicap}]`;
  if(i.date) h += `DT[${sgfText(i.date)}]`;
  if(i.result) h += `RE[${sgfText(i.result)}]`;
  const ab = (g.setup||[]).filter(p=>p.color==='B').map(p=>`[${coordChar(p.x)}${coordChar(p.y)}]`).join('');
  const aw = (g.setup||[]).filter(p=>p.color==='W').map(p=>`[${coordChar(p.x)}${coordChar(p.y)}]`).join('');
  if(ab) h += `AB${ab}`; if(aw) h += `AW${aw}`;
  return h + gameBody(g.tree) + ')';
}
/** Lee un SGF conservando variantes, comentarios y datos de la cabecera. */
function parseGameSGF(text){
  const gt = parseSGF(text);
  if(!gt) throw new Error('SGF no válido');
  const head = gt.sequence[0] || {};
  const size = head.SZ ? parseInt(head.SZ[0],10) : 19;
  const bs = [9,13,19].includes(size) ? size : 19;
  const setup = [];
  (head.AB||[]).forEach(v=>{ const q=sgfXY(v); if(q) setup.push({x:q.x,y:q.y,color:'B'}); });
  (head.AW||[]).forEach(v=>{ const q=sgfXY(v); if(q) setup.push({x:q.x,y:q.y,color:'W'}); });
  const tree = newTreeRoot();
  const walk = (g, parent, first)=>{
    let cur = parent;
    g.sequence.forEach((props, i)=>{
      const mv = props.B ? {c:'B', v:props.B[0]} : (props.W ? {c:'W', v:props.W[0]} : null);
      if(mv){
        const isPass = mv.v==='' || (mv.v==='tt' && bs<=19);
        const q = isPass ? null : sgfXY(mv.v);
        if(!isPass && (!q || q.x>=bs || q.y>=bs)) return;
        let child = isPass ? cur.children.find(c=>c.pass && c.color===mv.c) : cur.children.find(c=>c.x===q.x && c.y===q.y && c.color===mv.c);
        if(!child){ child = isPass ? newPassNode(mv.c) : newTreeNode(q.x,q.y,mv.c); addChildSorted(cur, child); }
        cur = child;
        if(props.C && props.C[0] && !cur.comment) cur.comment = props.C[0];
        mergeMarks(cur, marksFromProps(props, bs));
      } else if(first && i===0){ if(props.C && props.C[0]) cur.comment = props.C[0]; mergeMarks(cur, marksFromProps(props, bs)); }
      else { if(props.C && props.C[0] && !cur.comment) cur.comment = props.C[0]; mergeMarks(cur, marksFromProps(props, bs)); }
    });
    g.children.forEach(ch=>walk(ch, cur, false));
  };
  walk(gt, tree, true);
  const v = k=>(head[k] && head[k][0]) || '';
  const info = {pb:v('PB'), pw:v('PW'), br:v('BR'), wr:v('WR'), komi:v('KM'), handicap:parseInt(v('HA'),10)||0, date:v('DT'), result:v('RE')};
  return {boardSize:bs, setup, tree, info, name:v('GN')};
}

  flagFilter.addEventListener('click', ()=>{ State.collFlagOnly = !State.collFlagOnly; render(); });
  flagRow.appendChild(flagFilter); root.appendChild(flagRow);
  const q = (State.search[kind]||'').trim().toLowerCase();
  const hay = g=>((g.title||'')+' '+((g.info&&g.info.pb)||'')+' '+((g.info&&g.info.pw)||'')).toLowerCase();
  const cmp = {
    'alpha': (a,b)=>naturalCompare(a.title||'', b.title||''),
    'alpha-desc': (a,b)=>naturalCompare(b.title||'', a.title||''),
    'newest': (a,b)=>(b.createdAt||0)-(a.createdAt||0),
    'oldest': (a,b)=>(a.createdAt||0)-(b.createdAt||0),
  }[State.collSort || 'alpha'];
  const cf = State.collFolder || 'all';
  if(hiddenGames>0){
    const hn = document.createElement('p'); hn.className='hint';
    hn.textContent = `${hiddenGames} partida(s) en carpetas desactivadas (Ajustes → Repaso).`;
    root.appendChild(hn);
  }
  const list = items.filter(g=>(!q || hay(g).includes(q)) && (!State.collFlagOnly || g.flag)
    && (cf==='all' || (cf==='__none__' ? !g.folder : g.folder===cf))).sort(cmp);
  if(!list.length){
    const empty = document.createElement('div'); empty.className='empty';
    empty.innerHTML = allItems.length ? '<div class="big">Nada que mostrar</div>' : `<div class="big">Aún no hay ${kind==='game'?'partidas':'josekis'}</div>`;
    root.appendChild(empty); appendImportRow(root, kind); return;
  }
  const renderOne = g=>{
    const item = document.createElement('div'); item.className='card-item';
    const mini = document.createElement('div'); mini.className='mini';
    const stones = new Map(); (g.setup||[]).forEach(p=>stones.set(p.x+','+p.y,p.color));
    if(kind==='joseki'){
      // sigue la línea principal hasta la primera jugada con varias opciones: esa es la posición que se muestra
      const path = [g.tree]; let n = g.tree;
      while(n.children.length===1){ n = n.children[0]; path.push(n); }
      const shown = buildLineDisplay(g.boardSize, g.setup||[], pathToMoves(path)).stones;
      const mk = new Map();
      if(n.children.length>1) n.children.filter(c=>!c.pass).forEach(c=>mk.set(c.x+','+c.y, {type:'hint', verdict:null, n:1}));
      const pts = []; shown.forEach((c,k)=>{ const [x,y]=k.split(',').map(Number); pts.push({x,y}); });
      mk.forEach((v,k)=>{ const [x,y]=k.split(',').map(Number); pts.push({x,y}); });
      const crop = pts.length ? computeCropBounds(g.boardSize, pts, null, null) : null;
      renderBoard(mini, g.boardSize, shown, null, mk, null, null, crop, false);
    } else renderBoard(mini, g.boardSize, stones, null, null);
    item.appendChild(mini);
    if(kind==='joseki' && !josekiFolderOn(g)) item.style.opacity = '0.55';
    item.appendChild(starBtn(!!g.flag, async ()=>{ g.flag = !g.flag; await storeSet(C.prefix+g.id, g); render(); }));
    const info = document.createElement('div'); info.className='info';
    info.innerHTML = `<div class="note">${esc(g.title)||'(sin título)'}${kind==='joseki'&&!josekiFolderOn(g)?' <span style="font-size:11px;color:var(--ink-soft);">· carpeta desactivada en Ajustes</span>':''}</div><div class="meta">${gameMetaLine(g)}</div>`;
    item.appendChild(info);
    const actions = document.createElement('div'); actions.className='actions';

    const openBtn = document.createElement('button'); openBtn.className='btn pine small'; openBtn.textContent='Abrir';
    openBtn.addEventListener('click', ()=>{ if(kind==='joseki') openJosekiFile(g); else openItem(g, kind); });
    const sgfBtn = document.createElement('button'); sgfBtn.className='btn ghost small'; sgfBtn.textContent='.sgf';
    sgfBtn.addEventListener('click', ()=>downloadText((g.title||C.one).replace(/[^a-z0-9]+/gi,'_').toLowerCase()+'.sgf', kind==='joseki' ? bookToSGF(g) : gToSgf(g)));
    const delBtn = document.createElement('button'); delBtn.className='btn ghost small'; delBtn.textContent='Eliminar';
    delBtn.addEventListener('click', async ()=>{
      if(!confirm('¿Eliminar?')) return;
      await storeDelete(C.prefix+g.id); State.lists[kind] = await storeListColl(kind); render();
    });
    actions.appendChild(openBtn); actions.appendChild(sgfBtn); actions.appendChild(delBtn);
    item.appendChild(actions);
    root.appendChild(item);
  };
  const groups = new Map();
  list.forEach(g=>{ const k = g.folder||''; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(g); });
  const keys = Array.from(groups.keys()).sort((a,b)=> a===''?1 : b===''?-1 : naturalCompare(a,b));
  keys.forEach(k=>{
    if(keys.length>1 || k!==''){
      const gh = document.createElement('div');
      gh.style.cssText='font-size:12.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; margin:16px 0 6px;';
      gh.textContent = k || 'Sin carpeta';
      root.appendChild(gh);
    }
    groups.get(k).forEach(renderOne);
  });
  appendImportRow(root, kind);
}

function gameInfoPanel(gm){
  const info = gm.info;
  const wrap = document.createElement('div'); wrap.className='lines-box';
  const set = (k,v)=>{ info[k]=v; gm.dirty=true; gameAutosave(); };
  const inp = (label, key, ph, mode)=>{
    const f = document.createElement('div'); f.className='field'; f.style.flex='1'; f.style.minWidth='0';
    f.innerHTML = `<label>${label}</label>`;
    const cur0 = info[key]==null ? '' : String(info[key]);
    const i = document.createElement('input'); i.type = (mode==='date' && cur0 && !/^\d{4}-\d\d-\d\d$/.test(cur0)) ? 'text' : (mode||'text'); i.value = cur0; i.placeholder = ph||'';
    i.addEventListener('input', ()=>set(key, i.value));
    f.appendChild(i); return f;
  };
  const row = (...fs)=>{ const r = document.createElement('div'); r.className='row'; fs.forEach(f=>r.appendChild(f)); return r; };
  wrap.appendChild(row(inp('● Negro','pb','Nombre'), inp('Kyu / dan','br','12k')));
  wrap.appendChild(row(inp('○ Blanco','pw','Nombre'), inp('Kyu / dan','wr','10k')));
  {
    const sf = document.createElement('div'); sf.className='field';
    sf.innerHTML = '<label>Tablero</label>';
    const tg = document.createElement('div'); tg.className='toggle-group';
    [9,13,19].forEach(sz=>{
      const b = document.createElement('button'); b.textContent = sz+'×'+sz;
      if(gm.boardSize===sz) b.classList.add('active');
      b.addEventListener('click', ()=>{
        if(gm.boardSize===sz) return;
        const hasMoves = gm.tree.children.length>0;
        if(hasMoves && !confirm('Cambiar el tamaño borrará las jugadas de esta partida. ¿Continuar?')) return;
        gm.boardSize = sz; gm.tree = newTreeRoot(); gm.path = [gm.tree]; pendingClear(gm);
        gm.setup = handicapStones(sz, parseInt(info.handicap,10)||0);
        gm.dirty = true; gameAutosave(); render();
      });
      tg.appendChild(b);
    });
    sf.appendChild(tg); wrap.appendChild(sf);
  }
  const hf = document.createElement('div'); hf.className='field'; hf.style.flex='1'; hf.style.minWidth='0';
  hf.innerHTML = '<label>Handicap</label>';
  const hi = document.createElement('input'); hi.type='text'; hi.inputMode='numeric'; hi.value = info.handicap||0;
  hi.addEventListener('change', ()=>{
    let h = parseInt(hi.value,10); if(isNaN(h)||h<0) h=0; if(h===1) h=0; if(h>9) h=9;
    set('handicap', h);
    if(!gm.tree.children.length){   // sin jugadas aún: coloca las piedras de handicap
      gm.setup = handicapStones(gm.boardSize, h); gm.firstMover = h>=2 ? 'W' : 'B';
      if(h>=2) info.komi = '0.5'; else if(info.komi==='0.5') info.komi = '6.5';
    }
    render();
  });
  hf.appendChild(hi);
  wrap.appendChild(row(hf, inp('Komi','komi','6.5'), inp('Fecha','date','', 'date')));
  wrap.appendChild(row(inp('Resultado','result','N+3.5')));
  return wrap;
}

  acts.appendChild(passBtn); acts.appendChild(delBtn);
  root.appendChild(acts);

  // comentario de la jugada actual
  {
    const lbl = total>0 ? `Comentario · jugada ${total} (${cur.pass ? 'pasar' : coordLabel(cur.x,cur.y,gm.boardSize)})` : 'Comentario inicial';
    const f = document.createElement('div'); f.className='field';
    f.innerHTML = `<label>${lbl}</label>`;
    const t = document.createElement('textarea'); t.style.minHeight='54px'; t.value = cur.comment||''; t.placeholder = 'Comentario de esta jugada';
    t.addEventListener('input', ()=>{ if(t.value) cur.comment=t.value; else delete cur.comment; gm.dirty=true; gameAutosave(); });
    f.appendChild(t); root.appendChild(f);
  }

  if(gm.info){
    const det = document.createElement('details'); det.className='info-box';
    det.open = !!gm.infoOpen;
    det.addEventListener('toggle', ()=>{ gm.infoOpen = det.open; });
    const sm = document.createElement('summary');
    const i0 = gm.info;
    sm.textContent = 'Datos de la partida' + ((i0.pb||i0.pw) ? ` · ${i0.pb||'?'} vs ${i0.pw||'?'}` : '');
    det.appendChild(sm); det.appendChild(gameInfoPanel(gm));
    root.appendChild(det);
  }

  const cardBtnRow = document.createElement('div'); cardBtnRow.className='btnrow';
  const cardBtn = document.createElement('button'); cardBtn.className='btn ghost small'; cardBtn.textContent='Crear tarjeta desde esta posición';
  cardBtn.addEventListener('click', cardFromGamePosition);
  cardBtnRow.appendChild(cardBtn);
  root.appendChild(cardBtnRow);

  if(gm.tree.children.length){
    const box = document.createElement('div'); box.className='lines-box tree-scroll';
    renderTreeGraph(box, gm.tree, gm.boardSize, gm.path, (path)=>{ gm.path = path; render(); });
    root.appendChild(box);
  }
}

async function importFromText(text){
  let incoming;
  try{
    incoming = JSON.parse(text);
    if(!Array.isArray(incoming)) throw new Error('formato no reconocido');
  }catch(e){
    showToast('Ese texto no parece ser una copia válida de tarjetas.', 'warn');
    render();
    return;
  }
  let created = 0, updated = 0;
  for(const card of incoming){
    if(!card || !card.id) continue;
    const already = await storeGet('card:'+card.id);
    if(already) updated++; else created++;
    await storeSet('card:'+card.id, normalizeCard(card));
  }
  State.cards = await storeListCards();
  await updateDueBadge();
  setSettingsNote(`Importadas: ${created} nuevas, ${updated} actualizadas.`);
  render();
}

/** Hash corto y estable (53 bits): una misma fuente da siempre el mismo id, así reimportar no duplica ni pisa tarjetas. */
function hash53(str){
  let h1=0xdeadbeef, h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
function prettyBookName(fileName){
  return fileName.replace(/\.(sgf|zip)$/i,'').replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim()
    .replace(/\b\w/g, c=>c.toUpperCase());
}
function problemTitle(parsed, fallback){
  const t = (parsed.name||'').trim();
  const m = /^problem[a-z]*\s*#?\s*(\d+(?:[-.]\d+)*)\s*(?:,.*)?$/i.exec(t);
  if(m) return 'Problema '+m[1];
  if(t && t.length<=60) return t;
  return fallback;
}
async function importBulkFiles(files){
  files = Array.from(files||[]).filter(Boolean);
  if(!files.length) return;
  try{
    // 1) reunir fuentes: {name, text, folder}
    const sources = [];
    for(const file of files){
      const base = prettyBookName(file.name);
      if(file.name.toLowerCase().endsWith('.zip')){
        const entries = readZip(await file.arrayBuffer()).filter(e=>e.name.toLowerCase().endsWith('.sgf'));
        if(entries.length===0) throw new Error(`«${file.name}» no contiene archivos .sgf`);
        entries.forEach(e=>{
          const parts = e.name.split('/').filter(Boolean);
          const sub = parts.slice(0,-1).join(' / ');
          sources.push({name:parts[parts.length-1], text:e.text, folder: sub ? base+' / '+sub : base, key:file.name+'/'+e.name, single:false});
        });
      } else {
        sources.push({name:file.name, text:await file.text(), folder:base, key:file.name, single:true});
      }
    }
    // 2) convertir en tarjetas (por lotes, para no congelar la pantalla)
    let created = 0, existing = 0, failed = 0;
    let batch = [];
    const flush = async ()=>{ if(batch.length){ await storeSetMany(batch); batch = []; } };
    let processed = 0;
    for(const src of sources){
      try{
        const probs = sgfProblems(src.text);
        const isBook = probs.length>1;
        for(let pi=0; pi<probs.length; pi++){
          const parsed = importTree(probs[pi].tree);
          const id = 'imp-'+hash53(src.key+'#'+pi);
          if(memoryStore.has('card:'+id) || (storageMode==='local' && await storeGet('card:'+id))){ existing++; continue; }
          const correctLines = parsed.paths.length ? [parsed.paths[0]] : [];
          const wrongLines = parsed.paths.length>1 ? [parsed.paths[1]] : [];
          const fallback = isBook ? 'Problema '+(pi+1) : src.name.replace(/\.sgf$/i,'');
          batch.push(['card:'+id, {
            id, boardSize: parsed.size, setup: parsed.setup,
            folder: (isBook || !src.single) ? src.folder : '',
            tree: linesToTree(correctLines, wrongLines),
            marks: parsed.marks || [],
            title: problemTitle(parsed, fallback),
            note: isBook ? '' : (parsed.comment || ''),
            flag:false, doubt:false, createdAt: Date.now(), srs: defaultSRS(),
            toPlay: parsed.toPlay || (parsed.paths[0] && parsed.paths[0][0] ? parsed.paths[0][0].color : 'B'),
          }]);
          created++;
          if(batch.length>=300){
            await flush(); setSettingsNote(`Importando… ${created} tarjetas`); render();
            await new Promise(r=>setTimeout(r,0));
          }
        }
      }catch(e){ failed++; }
      processed++;
    }
    await flush();
    State.cards = await storeListCards();
    await updateDueBadge();
    const parts = [`${created} tarjeta(s) nuevas`];
    if(existing) parts.push(`${existing} ya existían (no se tocaron)`);
    if(failed) parts.push(`${failed} archivo(s) no se pudieron leer`);
    if(failed && !created) showToast('No se pudo importar: '+parts.join(', ')+'.', 'warn');
    else setSettingsNote('Importación lista: '+parts.join(', ')+'.');
    render();
  }catch(e){
    showToast('No se pudo importar: '+e.message, 'warn');
    render();
  }
}
