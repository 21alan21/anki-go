// --- práctica: como el repaso de tsumegos (doble toque o botón para confirmar; la máquina responde) ---
function jpMakeView(b){
  const p = State.prefs || {};
  const t = randomTransform(!!p.jsSym, !!p.jsInv);
  if(tfIsIdentity(t)) return b;
  return {boardSize:b.boardSize, tree:tfTree(b.tree, t, b.boardSize)};
}
function jpState(){
  const b = State.book;
  if(!State.jp || State.jp.tree!==b.tree){
    State.jp = {tree:b.tree, view:jpMakeView(b), path:[], side:null, pending:null, lastTap:0, panel:null, msg:'', notes:[], showOptions:false, busy:false, mistakes:0};
    State.jp.path = [State.jp.view.tree];
    State.jp.side = bookFirstColor(State.jp.view);
  }
  return State.jp;
}
function jpUserTurn(js){
  const cur = js.path[js.path.length-1];
  return cur.children.length>0 && (js.side==='both' || cur.children[0].color===js.side);
}
function jpMachineTurn(js){
  const cur = js.path[js.path.length-1];
  return cur.children.length>0 && js.side!=='both' && cur.children[0].color!==js.side;
}
function jpNote(label, node){
  const hasLoss = node.loss!=null && node.loss!=='';
  return {loss: hasLoss ? fmtLoss(node.loss) : '', text: node.comment||''};
}
/** La máquina responde sola (al azar entre las ramas de su color), igual que en el repaso de tsumegos. */
async function jpMachine(){
  const js = State.jp; if(!js || js.busy) return;
  js.busy = true;
  while(State.jp===js && jpMachineTurn(js)){
    await wait(380);
    if(State.jp!==js) return;
    const kids = js.path[js.path.length-1].children;
    const ch = kids[Math.floor(Math.random()*kids.length)];
    js.path = js.path.concat([ch]);
    js.notes.push(jpNote('Respuesta', ch));
    render();
  }
  js.busy = false;
  render();
}
function jpTap(x,y){
  const js = State.jp;
  if(js.busy || !jpUserTurn(js)) return;
  const stones = bookStones(js.view, js.path);
  if(stones.has(x+','+y)) return;
  const now = Date.now();
  const dbl = js.pending && js.pending.x===x && js.pending.y===y && (now-(js.lastTap||0))<400;
  js.pending = {x,y}; js.lastTap = now; js.panel = null; js.msg = '';
  if(dbl){ jpConfirm(); return; }
  render();
}
/** Si la posición actual es simétrica (espejo/giro), una jugada equivalente por simetría también vale:
 *  se reorienta la biblioteca para que esa jugada coincida con la rama correspondiente. */
function jpSymmetricMatch(js, x, y){
  const view = js.view, n = view.boardSize;
  const stones = bookStones(view, js.path);
  const cur = js.path[js.path.length-1];
  for(let m=0;m<2;m++) for(let r=0;r<4;r++){
    if(!m && !r) continue;
    const g = {r, m:!!m, swap:false};
    let inv = true;
    for(const [k,col] of stones){
      const [sx,sy] = k.split(',').map(Number);
      const [gx,gy] = tfPoint(g,n,sx,sy);
      if(stones.get(gx+','+gy)!==col){ inv=false; break; }
    }
    if(!inv) continue;
    if(!cur.children.some(c=>{ const [gx,gy]=tfPoint(g,n,c.x,c.y); return gx===x && gy===y; })) continue;
    const tree = tfTree(view.tree, g, n);
    const path = [tree]; let node = tree;
    for(let i=1;i<js.path.length;i++){
      const mv = js.path[i]; const [gx,gy] = tfPoint(g,n,mv.x,mv.y);
      node = node.children.find(c=>c.x===gx && c.y===gy);
      if(!node) { path.length=0; break; }
      path.push(node);
    }
    if(!path.length) continue;
    const hit = node.children.find(c=>c.x===x && c.y===y);
    if(!hit) continue;
    js.view = {boardSize:n, tree}; js.path = path;
    return hit;
  }
  return null;
}
function jpConfirm(){
  const js = State.jp;
  if(!js.pending || js.busy || !jpUserTurn(js)) return;
  const {x,y} = js.pending; js.pending = null;
  const cur = js.path[js.path.length-1];
  let match = cur.children.find(c=>c.x===x && c.y===y);
  if(!match){ match = jpSymmetricMatch(js, x, y); }
  if(!match){
    js.mistakes++; js.panel = 'miss'; js.msg = 'Esa jugada no está en tu biblioteca.';
    render(); return;
  }
  js.path = js.path.concat([match]);
  js.panel = null; js.msg = ''; js.notes = [jpNote('Tu jugada', match)];
  render();
  jpMachine();
}

/* ----------------------- Colecciones: partidas y josekis (fuera del repaso) ----------------------- */
const COLL = {
  game:   {prefix:'game:',   title:'Partidas',  one:'partida', hint:'Kifus para estudiar o revisar. No entran al repaso espaciado.', idp:'g'},
  joseki: {prefix:'joseki:', title:'Biblioteca de josekis', one:'joseki', hint:'Tus josekis con sus variantes. Alimentan la práctica; no entran al repaso espaciado.', idp:'j'},
};
async function storeListColl(kind){
  const prefix = COLL[kind].prefix;
  const out = [];
  const add = v=>{ try{ const g = JSON.parse(v); if(g && g.tree) out.push(g); }catch(e){} };
  if(storageMode==='session'){ memoryStore.forEach((v,k)=>{ if(k.startsWith(prefix)) add(v); }); return out; }
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(LS_PREFIX+prefix)){ const v = localStorage.getItem(k); if(v) add(v); }
    }
  }catch(e){ memoryStore.forEach((v,k)=>{ if(k.startsWith(prefix)) add(v); }); }
  return out;
}
function gameMainLength(tree){
  let n = 0, cur = tree;
  while(cur.children.length){ cur = cur.children[0]; n++; }
  return n;
}
function gameMetaLine(g){
  const i = g.info || {};

/** Piedras de handicap estándar (puntos estrella). */
function handicapStones(size, h){
  if(!(h>=2) || ![9,13,19].includes(size)) return [];
  const lo = size===9 ? 2 : 3, hi = size-1-lo, mid = (size-1)/2;
  const P = {tr:[hi,lo], bl:[lo,hi], br:[hi,hi], tl:[lo,lo], l:[lo,mid], r:[hi,mid], t:[mid,lo], b:[mid,hi], c:[mid,mid]};
  const order = {2:['tr','bl'],3:['tr','bl','br'],4:['tr','bl','br','tl'],5:['tr','bl','br','tl','c'],6:['tr','bl','br','tl','l','r'],
    7:['tr','bl','br','tl','l','r','c'],8:['tr','bl','br','tl','l','r','t','b'],9:['tr','bl','br','tl','l','r','t','b','c']};
  return (order[Math.min(h,9)]||[]).map(k=>({x:P[k][0], y:P[k][1], color:'B'}));
}
function openItem(g, kind){
  if(State.game && State.game.dirty && State.game.id!==g.id && !confirm('Hay cambios sin guardar. ¿Descartarlos?')) return;
  const tree = cloneTree(g.tree);
  State.game = {
    kind, id:g.id, title:g.title||'', boardSize:g.boardSize, setup:JSON.parse(JSON.stringify(g.setup||[])),
    tree, path:[tree], folder:g.folder||'', createdAt:g.createdAt||Date.now(), firstMover: treeFirstColor(tree) || (g.info && g.info.handicap>=2 ? 'W' : 'B'),
    edit: true, flag: !!g.flag, dirty:false, saved: (State.lists[kind]||[]).some(x=>x.id===g.id),
    info: kind==='game' ? Object.assign(newInfo(), {date:''}, g.info||{}) : null,
  };
  render();
}
let gameSaveTimer = null;
/** Una partida que ya existe se guarda sola poco después de cada cambio (como la biblioteca de josekis). */
function gameAutosave(){
  const gm = State.game; if(!gm || !gm.saved) return;
  clearTimeout(gameSaveTimer);
  gameSaveTimer = setTimeout(()=>{ if(State.game===gm) saveItem(true); }, 700);
}
async function saveItem(silent){
  const gm = State.game, C = COLL[gm.kind];
  const title = (gm.title||'').trim() || (C.one.charAt(0).toUpperCase()+C.one.slice(1)+' '+fmtDate(todayISO()));
  const rec = {id:gm.id, title, boardSize:gm.boardSize, setup:gm.setup, tree:cloneTree(gm.tree), createdAt:gm.createdAt, flag:!!gm.flag, folder:(gm.folder||'').trim()};
  if(gm.info) rec.info = Object.assign({}, gm.info);
  await storeSet(C.prefix+gm.id, rec);
  gm.title = title; gm.dirty = false; gm.saved = true;
  State.lists[gm.kind] = await storeListColl(gm.kind);
  if(silent===true) return;   // autoguardado: sin aviso ni redibujar (no quita el foco al escribir)
  showToast('Guardado.');

function gameStones(gm){
  return buildLineDisplay(gm.boardSize, gm.setup, pathToMoves(gm.path)).stones;

function gameTurn(gm){
  const first = gm.tree.children[0] ? gm.tree.children[0].color : (gm.firstMover || 'B');
  return (gm.path.length-1)%2===0 ? first : (first==='B' ? 'W' : 'B');
}
function gameStep(d){
  const gm = State.game; if(!gm) return;
  if(d<0){ if(gm.path.length>1) gm.path = gm.path.slice(0,-1); }
  else {
    const cur = gm.path[gm.path.length-1];
    if(cur.children.length) gm.path = gm.path.concat([cur.children[0]]);
  }
  render();
}
function gameClick(x,y){
  const gm = State.game; if(!gm) return;
  treeClick(gm, x, y, {size:gm.boardSize, setup:gm.setup, color:()=>gameTurn(gm), onChange:()=>{ gm.dirty = true; gameAutosave(); }});
}
function cardFromGamePosition(){
  const gm = State.game;

document.addEventListener('keydown', e=>{
  const gm = State.game;
  if(!gm || !((gm.kind==='game' && State.view==='games') || (gm.kind==='joseki' && State.view==='joseki-lib'))) return;
  const tag = (e.target && e.target.tagName) || '';

function gameBody(node){
  let o = '';
  if(node.x!==null) o += `;${node.color}[${coordChar(node.x)}${coordChar(node.y)}]`;
  if(node.comment) o += `C[${sgfText(node.comment)}]`;
  o += marksToSGF(node.marks);
  if(node.children.length===1) o += gameBody(node.children[0]);
  else node.children.forEach(c=>{ o += '(' + gameBody(c) + ')'; });
  return o;
}
function gameToSGF(g){
  const i = g.info || {};
  let h = `(;GM[1]FF[4]CA[UTF-8]SZ[${g.boardSize}]`;
  if(g.title) h += `GN[${sgfText(g.title)}]`;
  if(i.pb) h += `PB[${sgfText(i.pb)}]`;
  if(i.pw) h += `PW[${sgfText(i.pw)}]`;
  if(i.br) h += `BR[${sgfText(i.br)}]`;
  if(i.wr) h += `WR[${sgfText(i.wr)}]`;
  if(i.komi!=='' && i.komi!=null) h += `KM[${sgfText(i.komi)}]`;
  if(i.handicap>=2) h += `HA[${i.handicap}]`;
  if(i.date) h += `DT[${sgfText(i.date)}]`;
  if(i.result) h += `RE[${sgfText(i.result)}]`;
  const ab = (g.setup||[]).filter(p=>p.color==='B').map(p=>`[${coordChar(p.x)}${coordChar(p.y)}]`).join('');
  const aw = (g.setup||[]).filter(p=>p.color==='W').map(p=>`[${coordChar(p.x)}${coordChar(p.y)}]`).join('');
  if(ab) h += `AB${ab}`; if(aw) h += `AW${aw}`;
  return h + gameBody(g.tree) + ')';
}
/** Lee un SGF conservando variantes, comentarios y datos de la cabecera. */
function parseGameSGF(text){
  const gt = parseSGF(text);
  if(!gt) throw new Error('SGF no válido');
  const head = gt.sequence[0] || {};
  const size = head.SZ ? parseInt(head.SZ[0],10) : 19;
  const bs = [9,13,19].includes(size) ? size : 19;
  const setup = [];
  (head.AB||[]).forEach(v=>{ const q=sgfXY(v); if(q) setup.push({x:q.x,y:q.y,color:'B'}); });
  (head.AW||[]).forEach(v=>{ const q=sgfXY(v); if(q) setup.push({x:q.x,y:q.y,color:'W'}); });
  const tree = newTreeRoot();
  const walk = (g, parent, first)=>{
    let cur = parent;
    g.sequence.forEach((props, i)=>{
      const mv = props.B ? {c:'B', v:props.B[0]} : (props.W ? {c:'W', v:props.W[0]} : null);
      if(mv){
        const q = sgfXY(mv.v);
        if(!q || q.x>=bs || q.y>=bs) return;
        let child = cur.children.find(c=>c.x===q.x && c.y===q.y && c.color===mv.c);
        if(!child){ child = newTreeNode(q.x,q.y,mv.c); cur.children.push(child); }
        cur = child;
        if(props.C && props.C[0] && !cur.comment) cur.comment = props.C[0];
        mergeMarks(cur, marksFromProps(props, bs));
      } else if(first && i===0){ if(props.C && props.C[0]) cur.comment = props.C[0]; mergeMarks(cur, marksFromProps(props, bs)); }
      else { if(props.C && props.C[0] && !cur.comment) cur.comment = props.C[0]; mergeMarks(cur, marksFromProps(props, bs)); }
    });
    g.children.forEach(ch=>walk(ch, cur, false));
  };
  walk(gt, tree, true);
  const v = k=>(head[k] && head[k][0]) || '';
  const info = {pb:v('PB'), pw:v('PW'), br:v('BR'), wr:v('WR'), komi:v('KM'), handicap:parseInt(v('HA'),10)||0, date:v('DT'), result:v('RE')};
  return {boardSize:bs, setup, tree, info, name:v('GN')};
}
function gToSgf(g){ return gameToSGF(g); }
function pickSgfFiles(kind){
  if(kind==='joseki'){ pickJosekiFiles(); return; }
  const file = document.createElement('input'); file.type='file'; file.accept='.sgf'; file.multiple = true;
  file.addEventListener('change', async ()=>{
    let ok=0, bad=0;
    for(const f of Array.from(file.files||[])){
      try{
        const parsed = parseGameSGF(await f.text());
        const pl = (parsed.info.pb||parsed.info.pw) ? `${parsed.info.pb||'?'} vs ${parsed.info.pw||'?'}` : '';
        const rec = {id:COLL[kind].idp+uid(), title: parsed.name || pl || f.name.replace(/\.sgf$/i,''), boardSize:parsed.boardSize, setup:parsed.setup, tree:parsed.tree, info:parsed.info, createdAt:Date.now(), folder:(State.collFolder && State.collFolder!=='all' && State.collFolder!=='__none__') ? State.collFolder : ''};
        await storeSet(COLL[kind].prefix+rec.id, rec); ok++;
      }catch(e){ bad++; }
    }
    State.lists[kind] = await storeListColl(kind);
    showToast(bad ? `Importados ${ok}; ${bad} no se pudieron leer.` : `Importados ${ok}.`, bad?'warn':'ok');
    render();
  });
  file.click();
}

function gameInfoPanel(gm){
  const info = gm.info;
  const wrap = document.createElement('div'); wrap.className='lines-box';
  const set = (k,v)=>{ info[k]=v; gm.dirty=true; gameAutosave(); };
  const inp = (label, key, ph, mode)=>{
    const f = document.createElement('div'); f.className='field'; f.style.flex='1'; f.style.minWidth='0';
    f.innerHTML = `<label>${label}</label>`;
    const cur0 = info[key]==null ? '' : String(info[key]);
    const i = document.createElement('input'); i.type = (mode==='date' && cur0 && !/^\d{4}-\d\d-\d\d$/.test(cur0)) ? 'text' : (mode||'text'); i.value = cur0; i.placeholder = ph||'';
    i.addEventListener('input', ()=>set(key, i.value));
    f.appendChild(i); return f;
  };
  const row = (...fs)=>{ const r = document.createElement('div'); r.className='row'; fs.forEach(f=>r.appendChild(f)); return r; };
  wrap.appendChild(row(inp('● Negro','pb','Nombre'), inp('Kyu / dan','br','12k')));
  wrap.appendChild(row(inp('○ Blanco','pw','Nombre'), inp('Kyu / dan','wr','10k')));
  const hf = document.createElement('div'); hf.className='field'; hf.style.flex='1'; hf.style.minWidth='0';
  hf.innerHTML = '<label>Handicap</label>';
  const hi = document.createElement('input'); hi.type='text'; hi.inputMode='numeric'; hi.value = info.handicap||0;
  hi.addEventListener('change', ()=>{
    let h = parseInt(hi.value,10); if(isNaN(h)||h<0) h=0; if(h===1) h=0; if(h>9) h=9;
    set('handicap', h);
    if(!gm.tree.children.length){   // sin jugadas aún: coloca las piedras de handicap
      gm.setup = handicapStones(gm.boardSize, h); gm.firstMover = h>=2 ? 'W' : 'B';
      if(h>=2) info.komi = '0.5'; else if(info.komi==='0.5') info.komi = '6.5';

    render();
  });
  hf.appendChild(hi);
  wrap.appendChild(row(hf, inp('Komi','komi','6.5'), inp('Fecha','date','', 'date')));
  wrap.appendChild(row(inp('Resultado','result','N+3.5')));
  return wrap;

async function importFromText(text){
  let incoming;
  try{
    incoming = JSON.parse(text);
    if(!Array.isArray(incoming)) throw new Error('formato no reconocido');
  }catch(e){
    showToast('Ese texto no parece ser una copia válida de tarjetas.', 'warn');
    render();
    return;
  }
  let created = 0, updated = 0;
  for(const card of incoming){
    if(!card || !card.id) continue;
    const already = await storeGet('card:'+card.id);
    if(already) updated++; else created++;
    await storeSet('card:'+card.id, normalizeCard(card));
  }
  State.cards = await storeListCards();
  await updateDueBadge();
  showToast(`Importadas: ${created} nuevas, ${updated} actualizadas.`);
  render();
}

async function importBulkFile(file){
  if(!file) return;
  try{
    let entries;
    if(file.name.toLowerCase().endsWith('.zip')){
      const buffer = await file.arrayBuffer();
      entries = readZip(buffer).filter(e=>e.name.toLowerCase().endsWith('.sgf'));
      if(entries.length===0) throw new Error('el .zip no contiene archivos .sgf');
    } else {
      entries = [{name:file.name, text: await file.text()}];
    }
    let created = 0, failed = 0;
    for(const entry of entries){
      try{
        const parsed = importSGF(entry.text);
        const correctLines = parsed.paths.length ? [parsed.paths[0]] : [];
        const wrongLines = parsed.paths.length>1 ? [parsed.paths[1]] : [];
        const card = {
          id: uid(),
          boardSize: parsed.size,
          setup: parsed.setup,
          folder: '',
          tree: linesToTree(correctLines, wrongLines),
          marks: parsed.marks || [],
          title: parsed.name || entry.name.replace(/\.sgf$/i,''),
          note: parsed.comment || '',
          createdAt: Date.now(),
          srs: defaultSRS(),
        };
        await storeSet('card:'+card.id, card);
        created++;
      }catch(e){ failed++; }
    }
    State.cards = await storeListCards();
    await updateDueBadge();
    showToast(failed>0
      ? `Se importaron ${created} tarjetas (${failed} archivo(s) no se pudieron leer).`
      : `Se importaron ${created} tarjetas.`);
    render();
  }catch(e){
    showToast('No se pudo importar: '+e.message, 'warn');
    render();
  }
}
